name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: mvn --batch-mode --no-transfer-progress compile

      - name: Run examples (smoke test)
        run: |
          for cls in BasicPropositional AdvancedPropositional BasicPredicate AdvancedPredicate Jan2016; do
            echo "::group::$cls"
            java -cp target/classes discretemaths.examples.$cls
            echo "::endgroup::"
          done
